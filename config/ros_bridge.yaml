# Warning : tf and odometry must be changed according the name of robot
# Full set of configurations
- ros_topic_name: "turtle1/cmd_vel"
  gz_topic_name: "/turtle1/cmd_vel"
  ros_type_name: "geometry_msgs/msg/Twist"
  gz_type_name: "gz.msgs.Twist"
  subscriber_queue: 10
  publisher_queue: 10
  lazy: true
  direction: ROS_TO_GZ

- ros_topic_name: "imu"
  gz_topic_name: "/imu"
  ros_type_name: "sensor_msgs/msg/Imu"
  gz_type_name: "gz.msgs.IMU"
  subscriber_queue: 10
  publisher_queue: 10
  lazy: true
  direction: GZ_TO_ROS

