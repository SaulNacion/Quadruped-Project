# Lidar 2D configuration
- ros_topic_name: "/scan"
  gz_topic_name: "/lidar" 
  ros_type_name: "sensor_msgs/msg/LaserScan"
  gz_type_name: "gz.msgs.LaserScan"
  subscriber_queue: 10
  publisher_queue: 10
  lazy: true
  direction: GZ_TO_ROS

# Important topics to visualize information in rviz
- ros_topic_name: "tf"
  gz_topic_name: "/model/robot_diferencial_sensors/tf"
  ros_type_name: "tf2_msgs/msg/TFMessage"
  gz_type_name: "gz.msgs.Pose_V"
  subscriber_queue: 10
  publisher_queue: 10
  lazy: true
  direction: GZ_TO_ROS

- gz_topic_name: "/model/robot_diferencial_sensors/odometry"
  ros_topic_name : "/odom"
  ros_type_name: "nav_msgs/msg/Odometry"
  gz_type_name: "gz.msgs.Odometry"
  lazy: true
  direction: GZ_TO_ROS

# RGB Camera topics
- ros_topic_name: "camera/image_raw"
  gz_topic_name: "/camera/image_raw"
  ros_type_name: "sensor_msgs/msg/Image"
  gz_type_name: "gz.msgs.Image"
